<div class="countdown">
  <div class="cd-unit">
    <div class="cd-num">{{ parts().days }}</div>
    <div class="cd-label">days</div>
  </div>
  <div class="cd-unit">
    <div class="cd-num">{{ parts().hours }}</div>
    <div class="cd-label">hours</div>
  </div>
  <div class="cd-unit">
    <div class="cd-num">{{ parts().minutes }}</div>
    <div class="cd-label">minutes</div>
  </div>
</div>
